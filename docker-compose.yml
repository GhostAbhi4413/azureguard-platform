services:
  api:
    build:
      context: .
      dockerfile: backend/AzureGuard/AzureGuard/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${AZUREGUARD_SQL_CONNECTION:?Set AZUREGUARD_SQL_CONNECTION in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: AzureGuard
      Jwt__Audience: AzureGuard.Client
      AI__BaseUrl: http://ai:8000
      AI__TimeoutSeconds: 25
    ports: ["5006:8080"]
    depends_on: [db, ai]
  ai:
    build: ./ai-service
    environment:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Set AZURE_OPENAI_ENDPOINT in .env}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY in .env}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?Set AZURE_OPENAI_DEPLOYMENT in .env}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_TIMEOUT_SECONDS: ${AZURE_OPENAI_TIMEOUT_SECONDS:-25}
  angular:
    build: ./frontend-angular
    ports: ["4200:80"]
    depends_on: [api]
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
volumes:
  sql-data:
