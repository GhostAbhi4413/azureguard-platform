<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">AzureGuard end-to-end system flow</title>
  <desc id="desc">Implemented flow from Angular and Jenkins scanners through ASP.NET Core, SQL Server, deterministic policy evaluation, and Python Azure OpenAI remediation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#14233a"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61d2be"/><stop offset="1" stop-color="#38ad9a"/></linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67d3bf"/></marker>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.white{fill:#edf3fb}.muted{fill:#a1b0c4}.aqua{fill:#70d6c4}.purple{fill:#c4b5fd}.amber{fill:#ffd18c}.box{fill:#142137;stroke:#2c405e;stroke-width:1.5}.box2{fill:#211e3b;stroke:#5a4c88;stroke-width:1.5}.box3{fill:#102b31;stroke:#276158;stroke-width:1.5}.label{font-size:13px;letter-spacing:1.6px}.head{font-size:19px;font-weight:700}.txt{font-size:15px}.path{fill:none;stroke:#67d3bf;stroke-width:3;marker-end:url(#arr)}.ai{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#arr2)}.dash{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1500" height="900" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="aqua label">AZUREGUARD · VERIFIED SOURCE FLOW</text>
  <text x="66" y="116" class="white" font-size="36" font-weight="750">One release gate, two connected request paths</text>
  <text x="66" y="150" class="muted txt">Scanner evidence drives policy. AI explains findings after the fact; it never changes the decision.</text>

  <rect x="65" y="215" width="255" height="112" rx="16" class="box"/>
  <text x="89" y="249" class="aqua label">FRONTEND</text><text x="89" y="280" class="white head">Angular dashboard</text><text x="89" y="306" class="muted txt">JWT · projects/releases · findings · AI</text>

  <rect x="65" y="481" width="255" height="130" rx="16" class="box"/>
  <text x="89" y="515" class="amber label">SCANNER PIPELINE</text><text x="89" y="547" class="white head">Jenkins</text><text x="89" y="574" class="muted txt">Gitleaks + Trivy + Git diff</text><text x="89" y="596" class="muted txt">Signed report upload</text>

  <rect x="398" y="326" width="310" height="190" rx="18" class="box3"/>
  <text x="425" y="365" class="aqua label">APPLICATION API · ASP.NET CORE</text><text x="425" y="401" class="white head">Auth + controllers</text><text x="425" y="433" class="white txt">Validate DTOs · enforce JWT</text><text x="425" y="461" class="white txt">Normalize scanner reports</text><text x="425" y="489" class="white txt">Proxy sanitized AI requests</text>

  <rect x="800" y="215" width="275" height="140" rx="16" class="box"/>
  <text x="826" y="250" class="aqua label">PERSISTENCE</text><text x="826" y="283" class="white head">EF Core + SQL Server</text><text x="826" y="313" class="muted txt">Releases · findings · decisions</text><text x="826" y="337" class="muted txt">Azure SQL by configuration</text>

  <rect x="800" y="426" width="275" height="164" rx="16" class="box"/>
  <text x="826" y="461" class="amber label">DETERMINISTIC POLICY</text><text x="826" y="494" class="white head">RiskPolicyEngine</text><text x="826" y="524" class="muted txt">Critical → BLOCKED</text><text x="826" y="550" class="muted txt">Scanner failure → REVIEW_REQUIRED</text><text x="826" y="576" class="muted txt">Otherwise → local weighted policy</text>

  <rect x="1170" y="245" width="265" height="126" rx="16" class="box2"/>
  <text x="1196" y="280" class="purple label">INTERNAL AI SERVICE</text><text x="1196" y="314" class="white head">Python FastAPI</text><text x="1196" y="344" class="muted txt">POST /api/remediation</text>
  <rect x="1170" y="470" width="265" height="126" rx="16" class="box2"/>
  <text x="1196" y="505" class="purple label">CONFIGURED PROVIDER</text><text x="1196" y="539" class="white head">Azure OpenAI</text><text x="1196" y="569" class="muted txt">Explanation + fix + prevention</text>

  <path d="M320 270C353 270 362 369 388 369" class="path"/><text x="327" y="294" class="muted label">REST + JWT</text>
  <path d="M320 547H388" class="path"/><text x="326" y="535" class="muted label">HMAC REPORTS</text>
  <path d="M708 370C752 370 748 280 790 280" class="path"/><text x="718" y="318" class="muted label">EF QUERIES / SAVES</text>
  <path d="M708 458H790" class="path"/><text x="716" y="447" class="muted label">NORMALIZED FINDINGS</text>
  <path d="M1075 487C1115 487 1128 309 1160 309" class="ai"/><text x="1078" y="406" class="purple label">SANITIZED DTO</text>
  <path d="M1302 371V460" class="ai"/><text x="1318" y="423" class="purple label">MODEL REQUEST</text>
  <path d="M1170 535C1126 535 1125 525 1085 525" class="ai dash"/><text x="1085" y="562" class="purple label">STRUCTURED GUIDANCE</text>
  <path d="M800 544C720 640 520 656 325 610" class="path dash"/><text x="495" y="657" class="amber label">FINAL POLICY DECISION RETURNS TO PIPELINE</text>
  <path d="M800 330C650 176 460 178 320 226" class="path dash"/><text x="483" y="195" class="aqua label">ANGULAR DISPLAYS FINDINGS + DECISION</text>

  <rect x="65" y="724" width="1370" height="112" rx="18" fill="#0d1829" stroke="#263954"/>
  <text x="93" y="762" class="aqua label">IMPLEMENTATION BOUNDARIES</text>
  <text x="93" y="794" class="white txt">Implemented: Angular project/release flow · .NET/Python AI contract · Gitleaks/Trivy/Git diff ingestion · deterministic decisions.</text>
  <text x="93" y="820" class="muted txt">Unverified: live Azure OpenAI/SQL/Jenkins/SonarQube · Docker startup · browser E2E; Git-diff rules are heuristic.</text>
</svg>
